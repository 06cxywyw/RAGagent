<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RAG 面试助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f2f5;height:100vh;display:flex;flex-direction:column}
.header{background:linear-gradient(135deg,#1a73e8,#0d47a1);color:#fff;padding:18px 24px;font-size:20px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header span{font-weight:300;font-size:14px;color:rgba(255,255,255,.7);margin-left:12px}
.chat-area{flex:1;overflow-y:auto;padding:20px 16px;max-width:760px;margin:0 auto;width:100%}
.msg{margin-bottom:16px;padding:14px 18px;border-radius:12px;line-height:1.7;font-size:15px;white-space:pre-wrap;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.user{background:#1a73e8;color:#fff;margin-left:auto;max-width:80%;border-radius:12px 12px 4px 12px;text-align:right}
.bot{background:#fff;color:#333;border:1px solid #e4e6eb;max-width:85%;border-radius:12px 12px 12px 4px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.bot .sources{font-size:13px;color:#666;margin-top:10px;padding-top:8px;border-top:1px solid #eee}
.bot .sources summary{cursor:pointer;color:#1a73e8;font-weight:500;outline:none}
.bot .sources .doc{background:#f8f9fa;padding:8px 10px;margin:6px 0;border-radius:6px;font-size:13px;color:#555;max-height:100px;overflow-y:auto;line-height:1.5}
.input-area{background:#fff;border-top:1px solid #e4e6eb;padding:16px 20px;display:flex;gap:10px;max-width:760px;margin:0 auto;width:100%}
.input-area input{flex:1;padding:12px 18px;border:2px solid #e4e6eb;border-radius:24px;font-size:15px;outline:none;transition:border .2s}
.input-area input:focus{border-color:#1a73e8}
.input-area button{background:#1a73e8;color:#fff;border:none;border-radius:24px;padding:0 28px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
.input-area button:hover{background:#1557b0}
.input-area button:disabled{background:#ccc;cursor:not-allowed}
.loading{display:inline-block;width:14px;height:14px;border:2px solid #ddd;border-top-color:#1a73e8;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="header">RAG 面试助手<span>技术八股文知识库</span></div>
<div class="chat-area" id="chatArea">
  <div class="msg bot">你好！我是面试辅导助手，请提问一个面试问题 🎯</div>
</div>
<div class="input-area">
  <input type="text" id="q" placeholder="输入面试问题..." autofocus>
  <button id="btn">发送</button>
</div>

<script>
const q=document.getElementById('q'),btn=document.getElementById('btn'),area=document.getElementById('chatArea');
function addMsg(html,cls){
  const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;
  area.appendChild(d);area.scrollTop=area.scrollHeight;
}
function addLoading(){
  const d=document.createElement('div');d.className='msg bot';d.id='loading';
  d.innerHTML='<span class="loading"></span>思考中...';area.appendChild(d);area.scrollTop=area.scrollHeight;
}
btn.onclick=async()=>{
  const text=q.value.trim();if(!text)return;
  addMsg(text,'user');q.value='';btn.disabled=true;addLoading();
  try{
    const r=await fetch('/rag/chat?question='+encodeURIComponent(text));
    const d=await r.json();
    document.getElementById('loading')?.remove();
    const ctx=d.contexts||[];
    let html=d.answer||'(无回答)';
    if(ctx.length>0){
      html+='<div class="sources"><details><summary>参考文档 ('+ctx.length+'篇)</summary>';
      ctx.forEach((c,i)=>{html+='<div class="doc"><b>#'+(i+1)+'</b> '+c.slice(0,180)+'...</div>'});
      html+='</details></div>';
    }
    addMsg(html,'bot');
  }catch(e){
    document.getElementById('loading')?.remove();
    addMsg('请求失败: '+e.message,'bot');
  }
  btn.disabled=false;
};
q.onkeydown=e=>{if(e.key==='Enter')btn.click()};
</script>
</body>
</html>
