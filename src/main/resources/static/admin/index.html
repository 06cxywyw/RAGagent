<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RAG 管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f2f5;padding:24px;color:#333}
.container{max-width:800px;margin:0 auto}
h1{font-size:22px;margin-bottom:4px}
.desc{color:#666;font-size:14px;margin-bottom:24px}
.card{background:#fff;border-radius:12px;padding:20px 24px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card h2{font-size:16px;margin-bottom:12px;color:#1a73e8}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;font-size:14px;cursor:pointer;transition:background .2s;margin-top:8px}
.btn-primary{background:#1a73e8;color:#fff}
.btn-primary:hover{background:#1557b0}
.btn:disabled{background:#ccc;cursor:not-allowed}
textarea.result{width:100%;min-height:200px;margin-top:12px;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:monospace;background:#f8f9fa;resize:vertical;white-space:pre}
.drop-zone{border:2px dashed #ddd;border-radius:8px;padding:28px;text-align:center;color:#999;cursor:pointer;transition:border .2s,background .2s}
.drop-zone:hover{border-color:#1a73e8;background:#f8f9ff}
.drop-zone.dragover{border-color:#1a73e8;background:#e8f0fe}
.drop-zone .icon{font-size:32px;display:block;margin-bottom:6px}
.status{font-size:13px;color:#666;margin-top:6px}
.loading{display:inline-block;width:14px;height:14px;border:2px solid #ddd;border-top-color:#1a73e8;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
/* login overlay */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:999}
.overlay .box{background:#fff;border-radius:16px;padding:32px;width:360px;box-shadow:0 8px 32px rgba(0,0,0,.2);text-align:center}
.overlay .box h2{margin-bottom:8px;color:#1a73e8}
.overlay .box p{font-size:14px;color:#666;margin-bottom:20px}
.overlay .box input{width:100%;padding:12px 16px;border:2px solid #e4e6eb;border-radius:8px;font-size:16px;outline:none;transition:border .2s}
.overlay .box input:focus{border-color:#1a73e8}
.overlay .box .error{color:#e53935;font-size:13px;margin-top:8px;display:none}
</style>
</head>
<body>
<div class="overlay" id="loginOverlay">
  <div class="box">
    <h2>🔒 管理后台</h2>
    <p>请输入密码以继续</p>
    <input type="password" id="passwordInput" placeholder="输入密码" autofocus>
    <div class="error" id="loginError">密码错误，请重试</div>
    <button class="btn btn-primary" onclick="doLogin()" id="loginBtn" style="width:100%;margin-top:16px">确认</button>
  </div>
</div>
<div class="container" id="mainContent">
  <h1>RAG 管理</h1>
  <div class="desc">上传 .md 文档入库</div>

  <div class="card">
    <h2>📤 上传 .md 文件</h2>
    <p style="font-size:13px;color:#666;margin-bottom:8px">自动按标题（H2/H3/H4）切片入库</p>
    <div class="drop-zone" id="dropZone">
      <span class="icon">📂</span> 拖拽 .md 文件到此处，或点击选择
    </div>
    <input type="file" id="fileInput" accept=".md" style="display:none">
    <button class="btn btn-primary" onclick="uploadFile()" id="uploadBtn">上传并入库</button>
    <span class="status" id="uploadStatus"></span>
    <textarea class="result" id="uploadResult" readonly></textarea>
  </div>
</div>

<script>
const API = window.location.origin;
const STORAGE_KEY = 'admin_token';

function getToken() { return sessionStorage.getItem(STORAGE_KEY); }
function setToken(t) { sessionStorage.setItem(STORAGE_KEY, t); }
function clearToken() { sessionStorage.removeItem(STORAGE_KEY); }

async function authFetch(url, opts) {
  const token = getToken();
  const headers = opts.headers || {};
  headers['X-Admin-Token'] = token;
  opts.headers = headers;
  const r = await fetch(url, opts);
  if (r.status === 401) {
    clearToken();
    showLogin();
    throw new Error('密码错误，请重新登录');
  }
  return r;
}

function showLogin() {
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('passwordInput').value = '';
  document.getElementById('loginError').style.display = 'none';
  document.getElementById('passwordInput').focus();
}

function doLogin() {
  const pwd = document.getElementById('passwordInput').value.trim();
  if (!pwd) return;
  fetch(API+'/ops/upload', {
    method: 'POST',
    headers: { 'X-Admin-Token': pwd },
    body: new FormData()
  }).then(r => {
    if (r.status === 401) {
      document.getElementById('loginError').style.display = 'block';
    } else {
      setToken(pwd);
      document.getElementById('loginOverlay').style.display = 'none';
    }
  });
}

if (!getToken()) {
  document.getElementById('loginOverlay').style.display = 'flex';
} else {
  document.getElementById('loginOverlay').style.display = 'none';
}
document.getElementById('passwordInput').onkeydown = e => { if(e.key==='Enter') doLogin(); };

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
let selectedFile = null;
dropZone.onclick = () => fileInput.click();
dropZone.ondragover = e => { e.preventDefault(); dropZone.classList.add('dragover'); };
dropZone.ondragleave = () => dropZone.classList.remove('dragover');
dropZone.ondrop = e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files && e.dataTransfer.files.length) {
    selectedFile = e.dataTransfer.files[0];
    dropZone.textContent = '📄 ' + selectedFile.name;
  }
};
fileInput.onchange = () => {
  if (fileInput.files && fileInput.files[0]) {
    selectedFile = fileInput.files[0];
    dropZone.textContent = '📄 ' + selectedFile.name;
  }
};

async function uploadFile() {
  const file = (fileInput.files && fileInput.files[0]) ? fileInput.files[0] : selectedFile;
  if(!file) { alert('请选择文件'); return; }
  document.getElementById('uploadBtn').disabled = true;
  document.getElementById('uploadStatus').innerHTML = '<span class="loading"></span> 处理中...';
  const fd = new FormData(); fd.append('file', file);
  try {
    const r = await authFetch(API+'/ops/upload', {method:'POST', body:fd});
    document.getElementById('uploadResult').value = await r.text();
    document.getElementById('uploadStatus').textContent = '✅ 完成';
  } catch(e) {
    if (e.message !== '密码错误，请重新登录') {
      document.getElementById('uploadResult').value = '失败: '+e.message;
      document.getElementById('uploadStatus').textContent = '❌ 失败';
    }
  }
  document.getElementById('uploadBtn').disabled = false;
}
</script>
</body>
</html>
