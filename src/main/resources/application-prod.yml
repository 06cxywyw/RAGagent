spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ai_agent}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      embedding:
        options:
          model: text-embedding-v2
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1536
        distance-type: COSINE_DISTANCE

custom:
  llm:
    api-key: ${LLM_API_KEY}
    url: ${LLM_URL}
    model: ${LLM_MODEL}

rag:
  monitor:
    enabled: false